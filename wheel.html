<!doctype html>
<!-- The canonical wheel app lives at index.html in this repo (GitHub Pages
     serves it as the project root). On ostoe.com the deploy pipeline names
     the app wheel.html instead, so the sibling pages link to "wheel.html".
     This shim makes that link resolve here too. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=index.html">
<link rel="canonical" href="index.html">
<title>Prime Tread Wheel</title>
</head>
<body>
<p>The wheel lives at <a href="index.html">index.html</a>.</p>
</body>
</html>
